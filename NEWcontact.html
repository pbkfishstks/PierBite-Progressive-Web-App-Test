<!-- PIERBITE CONTACT FORM | PWA VERSION -->
<div id="pbcf1"></div>

<style>

#pbcf1{
--navy-deep:#05090f;
--navy-panel:#0e1c2b;
--navy-soft:#14283b;
--navy-line:#1e3448;
--ink:#eef5fb;
--im:#8fa9c1;
--if:#5d788f;
--lake:#8fd43c;
--good:#34c878;
--gold:#f5b53f;
--warn:#ff8a3d;
--bad:#ec5547;
--fs:"Inter",sans-serif;
font-family:var(--fs);
color:var(--ink);
background:var(--navy-deep);
}

#pbcf1 *{
box-sizing:border-box;
margin:0;
padding:0;
}

#pbcf1 a{
color:inherit;
}

#pbcf1 .w{
width:92%;
max-width:640px;
margin:0 auto;
padding:32px 0 60px;
}

#pbcf1 h1{
font-size:1.9rem;
font-weight:700;
letter-spacing:-.01em;
margin-bottom:10px;
}

#pbcf1 .bt2{
color:var(--lake);
}

#pbcf1 .dc{
color:var(--ink);
font-size:1.3rem;
font-weight:600;
}

#pbcf1 .sub{
font-size:.85rem;
color:var(--im);
margin-bottom:28px;
line-height:1.5;
}

#pbcf1 form{
background:var(--navy-panel);
border:1px solid var(--navy-line);
border-radius:12px;
padding:24px;
display:flex;
flex-direction:column;
gap:16px;
}

#pbcf1 label{
font-size:.68rem;
font-weight:600;
letter-spacing:.05em;
text-transform:uppercase;
color:var(--if);
display:block;
margin-bottom:6px;
}

#pbcf1 input,
#pbcf1 select{
width:100%;
background:var(--navy-soft);
border:1px solid var(--navy-line);
border-radius:8px;
padding:10px 12px;
color:var(--ink);
font-family:var(--fs);
font-size:.85rem;
}

#pbcf1 select{
-webkit-appearance:none !important;
-moz-appearance:none !important;
appearance:none !important;
background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%23f5b53f' d='M5.5 7.5L10 12l4.5-4.5z'/%3E%3C/svg%3E") !important;
background-repeat:no-repeat !important;
background-position:right 12px center !important;
background-size:16px 16px !important;
padding-right:36px !important;
}

#pbcf1 input:focus,
#pbcf1 select:focus{
outline:none;
border-color:var(--gold);
}

#pbcf1 .msgbox{
width:100%;
min-height:110px;
background:var(--navy-soft);
border:1px solid var(--navy-line);
border-radius:8px;
padding:10px 12px;
color:var(--ink);
font-family:var(--fs);
font-size:.85rem;
line-height:1.4;
white-space:pre-wrap;
word-wrap:break-word;
overflow-y:auto;
cursor:text;
}

#pbcf1 .msgbox:focus{
outline:none;
border-color:var(--gold);
}

#pbcf1 .msgbox.empty::before{
content:attr(data-placeholder);
color:var(--if);
}

#pbcf1 .msgbox.err-flag{
border-color:var(--bad);
}

#pbcf1 .fld{
display:flex;
flex-direction:column;
}

#pbcf1 button{
background:var(--gold);
color:#412402;
border:none;
border-radius:8px;
padding:12px 18px;
font-size:.85rem;
font-weight:700;
cursor:pointer;
margin-top:4px;
}

#pbcf1 button:hover{
filter:brightness(1.06);
}

#pbcf1 button:disabled{
opacity:.6;
cursor:default;
}

#pbcf1 .note{
font-size:.65rem;
color:var(--if);
margin-top:14px;
line-height:1.5;
}

#pbcf1 .fielderr{
font-size:.7rem;
color:var(--bad);
margin-top:4px;
display:none;
}

#pbcf1 .fielderr.show{
display:block;
}

#pbcf1 .ok,
#pbcf1 .err{
border-radius:10px;
padding:18px;
font-size:.85rem;
text-align:center;
}

#pbcf1 .ok{
background:var(--navy-panel);
border:1px solid var(--good);
color:var(--ink);
}

#pbcf1 .err{
background:var(--navy-panel);
border:1px solid var(--bad);
color:var(--ink);
margin-top:12px;
}

</style>

<script>

(function(){

var ENDPOINT="https://formspree.io/f/mnjeveqw";

var PIERS=[
"Port Washington",
"Sheboygan",
"Manitowoc",
"Two Rivers",
"Kewaunee",
"Algoma",
"Sturgeon Bay",
"Other / not pier-specific"
];

function esc(s){
return String(s).replace(/[&<>]/g,function(c){
return{
"&":"&amp;",
"<":"&lt;",
">":"&gt;"
}[c];
});
}

var opts=PIERS.map(function(p){
return '<option value="'+esc(p)+'">'+esc(p)+'</option>';
}).join('');

document.getElementById("pbcf1").innerHTML=

'<div class="w">'+

'<h1>Contact Pier<span class="bt2">Bite</span><span class="dc">.com</span></h1>'+

'<div class="sub">Questions, corrections, or something on a pier page that looks off &mdash; send it here. Got a favorite bait shop, restaurant, or fishing spot we should know about? Tell us that too. This is not for emergencies; for anything urgent, contact local authorities directly.</div>'+

'<form id="pbcf1-form">'+

'<div class="fld"><label for="pbcf1-name">Name</label><input id="pbcf1-name" name="name" type="text" required></div>'+

'<div class="fld"><label for="pbcf1-email">Email</label><input id="pbcf1-email" name="email" type="email" required></div>'+

'<div class="fld"><label for="pbcf1-pier">Which pier is this about?</label><select id="pbcf1-pier" name="pier">'+opts+'</select></div>'+

'<div class="fld"><label>Message</label>'+

'<div id="pbcf1-msg" class="msgbox empty" contenteditable="true" data-placeholder="Type your message here..." role="textbox" aria-multiline="true"></div>'+

'<div id="pbcf1-msg-err" class="fielderr">Please enter a message before sending.</div>'+

'</div>'+

'<button type="submit" id="pbcf1-btn">Send Message</button>'+

'<div class="note">Sent via a secure third-party form service. PierBite does not store your message on its own servers.</div>'+

'</form>'+

'</div>';

var form=document.getElementById("pbcf1-form");
var msgBox=document.getElementById("pbcf1-msg");
var msgErr=document.getElementById("pbcf1-msg-err");

msgBox.addEventListener("input",function(){

if(msgBox.textContent.trim()==""){
msgBox.classList.add("empty");
}else{
msgBox.classList.remove("empty");
msgBox.classList.remove("err-flag");
msgErr.classList.remove("show");
}

});

form.addEventListener("submit",function(e){

e.preventDefault();

var msgText=msgBox.textContent.trim();

if(msgText==""){
msgBox.classList.add("err-flag");
msgErr.classList.add("show");
msgBox.focus();
return;
}

var btn=document.getElementById("pbcf1-btn");

btn.disabled=true;
btn.textContent="Sending...";

var data=new FormData(form);

data.append("message",msgText);

fetch(
ENDPOINT,
{
method:"POST",
body:data,
headers:{
"Accept":"application/json"
}
}
)
.then(function(r){

if(r.ok){

document.getElementById("pbcf1")
.querySelector(".w")
.innerHTML=
'<h1>Contact PierBite</h1>'+
'<div class="ok">Thanks &mdash; your message was sent. I read every one and will get back to you as soon as I can.</div>';

}else{

btn.disabled=false;
btn.textContent="Send Message";

form.insertAdjacentHTML(
"beforeend",
'<div class="err">Something went wrong sending that. Please try again in a moment.</div>'
);

}

})
.catch(function(){

btn.disabled=false;
btn.textContent="Send Message";

form.insertAdjacentHTML(
"beforeend",
'<div class="err">Something went wrong sending that. Please try again in a moment.</div>'
);

});

});

})();

</script>

<script>
if ("serviceWorker" in navigator) {
window.addEventListener("load", function () {
navigator.serviceWorker
.register("./PierBite-PWA-Service-Worker.js")
.catch(function (error) {
console.error("PierBite PWA service worker registration failed:", error);
});
});
}
</script>

</body>
</html>
