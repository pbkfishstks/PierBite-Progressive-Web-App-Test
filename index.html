<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PierBite PWA Test</title>

  <meta name="theme-color" content="#061522">
  <link rel="manifest" href="PierBite-Web-App-Manifest.webmanifest">
  <link rel="apple-touch-icon" href="PierBite-Apple-Touch-Icon-180x180.png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #061522;
      color: #eef5fb;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .test-panel {
      max-width: 600px;
      padding: 40px 24px;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 2.5rem;
    }

    .pier {
      color: #ffffff;
    }

    .bite {
      color: #39ff14;
    }

    p {
      color: #a3bcd1;
      line-height: 1.6;
    }

    .safe {
      margin-top: 24px;
      padding: 12px 16px;
      border: 1px solid #1f405b;
      border-radius: 10px;
      background: #112a3f;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <main class="test-panel">

    <h1>
      <span class="pier">PIER</span><span class="bite">BITE</span>
    </h1>

    <p>Progressive Web App Development Test</p>

    <div class="safe">
      This is the separate PierBite test environment.<br>
      The live PierBite.com website is not being modified.
    </div>

  </main>

</body>
</html>
